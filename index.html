<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- Full-bleed on a phone, and let the page paint under the notch and the home
     indicator, because the app inside already accounts for the safe-area insets. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<!-- Added to the home screen from HERE, so this page owns the icon, the name
     under it, and the status-bar colour — not script.google.com. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- NOT black-translucent. That asks iOS to run the app under the status bar,
     and iOS then cannot decide what the viewport is: measured on the same phone
     minutes apart it reported innerHeight 873 anchored at 0 (59pt spare at the
     bottom, a strip of this page's background under the app's tab bar) and then
     932 anchored at 59 (the same 59pt hanging off the bottom, which would take
     the tab bar with it). vrbroomrental.com sets none of this and has never had
     a strip.

     default lets iOS reserve the status bar and hand the page exactly what is
     left. theme-color below paints that reserved strip, so it is still cream
     rather than system white. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VRB Billing">
<!-- iOS composites a home-screen icon onto black, so this one is opaque cream
     rather than the transparent mark. -->
<link rel="apple-touch-icon" href="images/icon-ios.png">
<link rel="icon" href="images/icon-ios.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- The browser paints this before anything loads, so the very first frame is
     already the right colour instead of white. -->
<meta name="theme-color" content="#EFE8D9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110C" media="(prefers-color-scheme: dark)">

<!-- A private tool on a public domain. Keep it out of search results. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<title>VRB Billing</title>

<style>
  /* The house palette, so the shell and the app inside are the same colour and
     there is no flash of the wrong one while Google wakes up. */
  :root { --bg:#EFE8D9; --ink:#191510; --muted:#7E7462; --accent:#8A6B22; --line:#DFD4BE; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14110C; --ink:#F2EBDB; --muted:#9A9080; --accent:#D6B052; --line:#3A3225; }
  }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  /* Two boxes, because one cannot do both jobs.
     
     #stage is a plain div, so inset:0 stretches it to the viewport's real
     edges. That is the part that has to be right: 100dvh stopped short of the
     home indicator in a home-screen app, leaving a band of this page's
     background under the app's own tab bar, and height:100% on a fixed element
     did the same, because iOS can resolve that percentage against a layout
     viewport that excludes the bottom safe area even under viewport-fit=cover.
     Offsets have no height to resolve wrongly. #boot has used inset:0 from the
     start and has never shown the gap.

     The iframe then fills #stage with plain percentages. It cannot take the
     inset:0 itself: an iframe is a REPLACED element, so width:auto/height:auto
     do not stretch to the offsets — they fall back to its intrinsic 300x150,
     and the app renders in a small box in the corner. Measured on an iPhone
     runtime: "w 300 x h 150". Against #stage, 100% is a percentage of a box
     that is already the right size, which is safe. */
  /* #stage is a plain div so that it can be stretched by offsets — an iframe
     is a replaced element and would fall back to its intrinsic 300x150 here.
     The iframe then fills it with plain percentages, which are safe against a
     box that is already the right size. */
  #stage {
    position: fixed;
    inset: 0;
    background: var(--bg);
  }

  /* TEMPORARY · one more reading to confirm, then this goes. */
  #probe { position: fixed; left: 8px; bottom: 8px; z-index: 10000;
           font: 10px/1.3 ui-monospace, Menlo, monospace;
           background: rgba(0,0,0,.7); color: #fff; padding: 4px 6px;
           border-radius: 5px; white-space: pre; pointer-events: none; opacity: .85 }
  #stage iframe {
    display: block; border: 0;
    width: 100%; height: 100%;
  }

  /* Shown until the frame reports it has loaded. */
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 0 28px; text-align: center;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--muted); background: var(--bg);
    transition: opacity .3s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot img { width: 62px; height: auto; }
  #boot .name {
    font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    font-size: 21px; font-weight: 600; color: var(--ink); letter-spacing: -.01em;
  }
  #boot .kicker {
    font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent); margin-top: -12px;
  }
  .spin {
    width: 20px; height: 20px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: sp .7s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; opacity: .5 } }
  #boot .late { display: none; max-width: 25em; font-size: 13.5px }
  #boot.slow .late { display: block }
  #boot a { color: var(--accent) }
</style>
</head>
<body>

<div id="boot">
  <img src="images/icon.png" alt="">
  <div class="name">VRB Room Rental</div>
  <div class="kicker">Billing Dashboard</div>
  <div class="spin"></div>
  <div class="late">
    Still opening. Google can be slow to wake the first time each day. If it does not
    clear, you may need to sign in to Google first —
    <a id="direct" href="#" target="_blank" rel="noopener">open it directly</a>.
  </div>
</div>

<!--
  allow="camera" is what lets the ID-photo picker reach the camera from inside a
  cross-origin frame. Without it the picker still opens, but "Take Photo" is
  missing on iOS.
-->
<div id="stage">
  <iframe
    id="app"
    title="VRB Billing"
    allow="camera; microphone; clipboard-write"
    referrerpolicy="no-referrer"
    src=""></iframe>
</div>

<div id="probe">measuring…</div>

<script>
  // ── The only line you edit ────────────────────────────────────────────────
  // Apps Script → Deploy → Manage deployments → copy the /exec URL.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz3rOb27ddUiAknCC_-KOFIwYjCAG9QeJ1XCrq-2evgWHay6Dbd2XPTPzZCkV82cLvO/exec';

  // TEMPORARY · one more reading, then this goes.
  setInterval(function () {
    var st = document.getElementById('stage').getBoundingClientRect();
    var vv = window.visualViewport;
    document.getElementById('probe').textContent =
      'screen ' + screen.height + '  inner ' + window.innerHeight + '\n' +
      'vv ' + (vv ? Math.round(vv.height) + ' off' + Math.round(vv.offsetTop) +
                    ' pg' + Math.round(vv.pageTop) : 'n/a') +
      '  scroll ' + Math.round(window.pageYOffset) + '\n' +
      'stage ' + Math.round(st.top) + ' \u2192 ' + Math.round(st.bottom);
  }, 400);

  var frame = document.getElementById('app');
  var boot  = document.getElementById('boot');
  var stage = document.getElementById('stage');

  /**
   * Put the viewport back after the keyboard.
   *
   * The strip is gone on opening and comes back the moment the PIN keyboard
   * appears, then stays. iOS shifts and shrinks the viewport to bring the
   * focused field into view, and in a home-screen app it does not always undo
   * that when the keyboard goes — the page is left scrolled, or innerHeight
   * stays short. Either way every fixed box, #stage included, ends up above the
   * screen bottom and this page's background shows through under the app's tab
   * bar. The field lives in a cross-origin frame so there is no focus event to
   * hook, but visualViewport reports all of it to the top-level page.
   *
   * While the keyboard is up visualViewport is SMALLER than the layout
   * viewport, so the guard below leaves it alone — no fighting the keyboard for
   * space it is legitimately using. It only ever grows #stage back.
   */
  function settle() {
    if (window.pageYOffset || document.documentElement.scrollTop) window.scrollTo(0, 0);
    stage.style.height = '';
    var vv = window.visualViewport;
    if (!vv) return;
    var full = Math.round(vv.height + vv.offsetTop);
    if (full > window.innerHeight + 1) stage.style.height = full + 'px';
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { setTimeout(settle, 60); });
    window.visualViewport.addEventListener('scroll', function () { setTimeout(settle, 60); });
  }
  window.addEventListener('resize', settle);
  window.addEventListener('orientationchange', function () { setTimeout(settle, 300); });
  window.addEventListener('pageshow', settle);
  settle();

  document.getElementById('direct').href = APP_URL;

  if (APP_URL.indexOf('PASTE_') === 0) {
    boot.innerHTML = '<div style="line-height:1.6"><b>Not set up yet.</b><br>' +
      'Edit <code>index.html</code> and put the Apps Script <code>/exec</code> URL ' +
      'into <code>APP_URL</code>.</div>';
  } else {
    frame.src = APP_URL;
    var landed = false;
    frame.addEventListener('load', function () {
      landed = true;
      boot.classList.add('gone');
    });
    // If Google is slow, or the account is not signed in, say so rather than
    // spinning forever with no explanation.
    setTimeout(function () { if (!landed) boot.classList.add('slow'); }, 6000);
  }

</script>
</body>
</html>
